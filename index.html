<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SpotyBAI</title>

<!-- WEBSITE LOGO / FAVICON -->
<link rel="icon" type="image/png" href="images/Black and Grey Simple Icon Music Logo.png">

<link rel="stylesheet" href="test.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="test.js" defer></script>
</head>


<!-- DECORATIVE GLOW -->
<body class="home-page">

<div class="glow one"></div>
<div class="glow two"></div>

<!-- BACKGROUND CHANGER -->
<input type="radio" name="background" id="bg1" checked>
<input type="radio" name="background" id="bg2">
<input type="radio" name="background" id="bg3">
<input type="radio" name="background" id="bg4">

<div class="home-background"></div>

<div class="bg-switcher">
    <span>Background</span>

    <label for="bg1"></label>
    <label for="bg2"></label>
    <label for="bg3"></label>
    <label for="bg4"></label>
</div>

<!-- SIDEBAR -->
<header class="sidebar">
    <div class="logo">
        <img class="logo-icon" src="images/Black and Grey Simple Icon Music Logo.png" alt="SpotyBAI Logo">
        <div>Spoty<span>BAI</span></div>
    </div>

    <nav aria-label="Main navigation">
        <a href="#" class="active" aria-current="page">
            <i class="fa-solid fa-house" aria-hidden="true"></i> Home
        </a>

        <a href="music test.html">
            <i class="fa-solid fa-music" aria-hidden="true"></i> Music
        </a>
    </nav>
</header>

<main class="hero">
    <div class="welcome">
        <div class="line"></div>

        <h1>
            Welcome to<br>
            Spoty<span>BAI!</span>
        </h1>

        <div class="line right"></div>
    </div>
</main>

<!-- NCS-STYLE LIVE RHYTHM ANIMATION (BETWEEN WELCOME & ABOUT) -->
<div class="ncs-rhythm-divider" aria-hidden="true">
    <span class="rhythm-tag">LIVE RHYTHM</span>
    <canvas id="ncs-rhythm-canvas" class="ncs-rhythm-canvas"></canvas>
</div>

<section id="about" class="about-section" aria-labelledby="about-title">
    <h2 id="about-title">About Spoty<span style="color: #699950;;">BAI</span></h2>
    <p>Feel Every Beat</p>
</section>

</body>
</html>
